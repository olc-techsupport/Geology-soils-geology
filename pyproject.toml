[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olc-tribal-soils-geology"
version = "0.2.0"
description = "Stage 2 reproducible geospatial workflows for the OLC USDA NIFA Tribal Soils and Geology series"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "Apache-2.0 (code only; see THIRD_PARTY_DATA.md)"}
authors = [{name = "Lilly Jones"}]

[project.scripts]
olc-soils-verify = "scripts.check_release:main"
olc-soils-build-3d = "scripts.build_3d_model:main"

[tool.setuptools]
packages = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
